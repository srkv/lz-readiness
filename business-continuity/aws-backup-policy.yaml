AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Backup centralized policy for RDS and EBS with cross-region replication

Parameters:
  DRRegion:
    Type: String
    Default: us-west-2
    Description: Disaster recovery region for backup replication

Resources:
  BackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: !Sub '${AWS::StackName}-primary-vault'
      LockConfiguration:
        MinRetentionDays: 7

  DRBackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: !Sub '${AWS::StackName}-dr-vault'

  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: ContosoProductionBackupPlan
        BackupPlanRule:
          - RuleName: DailyBackup
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: cron(0 5 ? * * *)
            StartWindowMinutes: 60
            CompletionWindowMinutes: 120
            Lifecycle:
              DeleteAfterDays: 35
              MoveToColdStorageAfterDays: 30
            CopyActions:
              - DestinationBackupVaultArn: !Sub 'arn:aws:backup:${DRRegion}:${AWS::AccountId}:backup-vault/${AWS::StackName}-dr-vault'
                Lifecycle:
                  DeleteAfterDays: 90
          - RuleName: WeeklyBackup
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: cron(0 3 ? * SUN *)
            Lifecycle:
              DeleteAfterDays: 2555
              MoveToColdStorageAfterDays: 90

  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: ProductionResources
        IamRoleArn: !GetAtt BackupRole.Arn
        ListOfTags:
          - ConditionType: STRINGEQUALS
            ConditionKey: backup
            ConditionValue: 'true'

  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup'
        - 'arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores'

Outputs:
  BackupVaultArn:
    Value: !GetAtt BackupVault.BackupVaultArn
  BackupPlanId:
    Value: !Ref BackupPlan
